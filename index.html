<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <div id="hero-img-cont">
            <img src="img/hero-img.jpg" alt="green-leaves">
            <div id="logo-cont"></div>
            <p id="author-txt">Photo by
                <a href="https://unsplash.com/@haliewestphoto" target="_blank" id="author-link">Halye West</a>
            </p>
        </div>
        
        <div id="right-side-cont">
            <div id="desc-cont">
                <p>
                    This is not a real online service! You know you need something
                    like this in your life to help you realize your deepest dreams.
                </p>
                <p>
                    You know you want to.
                </p>
            </div>

            <form action="" method="get">
                <p>Let's do this!</p>
                <div class="form-row">
                    <label for="">FIRST NAME</label>
                    <input type="text">
                    <label for="">LAST NAME</label>
                    <input type="text">
                </div>
                <div class="form-row">
                    <label for="">EMAIL</label>
                    <input type="text">
                    <label for="">PHONE NUMBER</label>
                    <input type="text">
                </div>
                <div class="form-row">
                    <label for="">PASSWORD</label>
                    <input type="text">
                    <label for="">CONFIRM PASSWORD</label>
                    <input type="text">
                </div>
            </form>
            
            <div id="button-cont">
                <button>Create Account</button>
                <p>Already have an account? <a href="">Log in</a></p>
            </div>
        </div>
    </body>
</html>
