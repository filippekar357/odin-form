<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <div id="hero-img-cont">
            <img src="img/hero-img.jpg" alt="green-leaves" id="hero-img">
            <div id="logo-cont">
                <img src="img/odin-lined.png" alt="ODIN" id="odin-logo">
                <p id="hero-txt">ODIN</p>
            </div>
            <p id="author-txt">Photo by
                <a href="https://unsplash.com/@haliewestphoto" target="_blank" id="author-link">Halye West</a>
            </p>
        </div>
        
        <div id="right-side-cont">
            <div id="desc-cont">
                <p>
                    This is not a real online service! You know you need something
                    like this in your life to help you realize your deepest dreams.
                </p>
                <p>
                    Sign up <em>now</em> to get started.
                </p>
                <p>
                    You know you want to.
                </p>
            </div>

            <p id="form-title">Let's do this!</p>
            <form action="" method="get" id="sign-up">
                <div class="form-column">
                    <label for="first-name">* FIRST NAME</label>
                    <input type="text" name="user-name" id="first-name" required>
                    <label for="email">* EMAIL</label>
                    <input type="email" name="user-mail" id="email" required>
                    <label for="password">* PASSWORD</label>
                    <input type="password" name="user-pass" id="password" required>
                </div>
                <div class="form-column">
                    <label for="last-name">* LAST NAME</label>
                    <input type="text" name="user-surname" id="last-name" required>
                    <label for="phone-num">* PHONE NUMBER</label>
                    <input type="tel" name="user-phone" id="phone-num" required>
                    <label for="password-confirm">* CONFIRM PASSWORD</label>
                    <input type="password" name="user-pass-confirm" id="password-confirm" required>
                </div>
            </form>
            
            <div id="button-cont">
                <button form="sign-up" type="submit" id="sbm-btn">Create Account</button>
                <p>Already have an account? <a href="">Log in</a></p>
            </div>
        </div>
    </body>
</html>
